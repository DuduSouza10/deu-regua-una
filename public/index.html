<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#11161d" />
  <title>Deu Régua — encontre o corte certo</title>
  <meta name="description" content="Encontre barbearias e barbeiros por estilo, preço, distância e avaliação. Agende online." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="site-chrome">
    <header class="topbar">
      <a class="brand" href="#/discover" aria-label="Deu Régua - início">
        <span class="brand-emblem"><img class="brand-logo" src="/assets/logo-mark.png" alt="" /></span>
        <span class="brand-name"><strong>Deu <b>Régua</b></strong><small>encontre, compare e agende</small></span>
      </a>
      <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button>
      <nav id="mainNav" class="main-nav"></nav>
      <div id="accountArea" class="account-area"></div>
    </header>
  </div>

  <main id="app" class="app-shell">
    <div class="page-loader"><span></span><span></span><span></span></div>
  </main>

  <footer class="footer-wrap">
    <footer class="footer">
      <div class="footer-brand">
        <div class="footer-brand-lockup"><img class="footer-mark" src="/assets/logo-mark.png" alt="" /><strong>Deu <b>Régua</b></strong></div>
        <span>Descubra barbearias, compare perfis e agende o corte certo para o seu estilo.</span>
      </div>
      <div class="footer-links">
        <a href="#/discover">Descobrir</a>
        <a href="#/compare">Comparar</a>
        <a href="#/plans">Planos</a>
        <a href="#/profile">Minha conta</a>
      </div>
      <small>Projeto acadêmico • Layout renovado • Dados persistentes no Railway</small>
    </footer>
  </footer>

  <div id="modalRoot" class="modal-root" aria-live="polite"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
